if(view==='m'){rows=Array.from({length:12},(_,k)=>({lab:(k+1)+'월',key:String(k+1).padStart(2,'0')}));cols=SY().map(y=>({lab:y+'년'+(y==='2026'?' (~9월)':''),y}));cell=(r,c)=>m[c.y+'-'+r.key];}
else if(view==='q'){const q=agg(m,k=>k.slice(0,4)+'-Q'+Math.ceil(+k.slice(5)/3));rows=[1,2,3,4].map(n=>({lab:n+'분기',key:n}));cols=SY().map(y=>({lab:y+'년'+(y==='2026'?' (~9월)':''),y}));cell=(r,c)=>{const v=q[c.y+'-Q'+r.key];return (c.y==='2026'&&r.key===4)?null:v;};}
else{const yy=agg(m,k=>k.slice(0,4));rows=SY().map(y=>({lab:y+'년'+(y==='2026'?' (~9월)':''),key:y}));cols=[{lab:'값'}];cell=r=>yy[r.key];}
const tot=agg(m,k=>k.slice(0,4));
return {rows,cols,cell,tot};
}

function legend(){const el=document.getElementById('legend');const C=yc();
el.innerHTML=YEARS.map((y,i)=>`<button class="yr" data-y="${y}" aria-pressed="${sel.has(y)}"><svg width="24" height="10" aria-hidden="true"><line x1="1" y1="5" x2="23" y2="5" stroke="${C[i]}" stroke-width="${view==='m'?2.5:8}" ${view==='m'&&DASH[i].length?`stroke-dasharray="${DASH[i].join(',')}"`:''}/></svg>${y}년${y==='2026'?' (~9월)':''}</button>`).join('')+`<span class="lghint">연도를 눌러 켜고 끌 수 있어요${sel.size<YEARS.length?' · <button class="yr" id="allY">전체 보기</button>':''}</span>`;
el.querySelectorAll('.yr[data-y]').forEach(b=>b.onclick=()=>{const y=b.dataset.y;if(sel.has(y)){if(sel.size===1)return;sel.delete(y);}else sel.add(y);render();});
const a=document.getElementById('allY');if(a)a.onclick=()=>{sel=new Set(YEARS);render();};}

function table(i,B){
const {rows,cols,cell,tot}=B;
let h='<table><thead><tr><th>'+(view==='y'?'연도':view==='q'?'분기':'월')+'</th>'+cols.map(c=>`<th>${c.lab}</th>`).join('')+'</tr></thead><tbody>';
rows.forEach(r=>{h+='<tr><td>'+r.lab+'</td>'+cols.map(c=>{const v=val(cell(r,c),i);return `<td class="${v==null?'na':v<0?'neg':''}">${fmt(i,v,true)}</td>`;}).join('')+'</tr>';});
h+='</tbody>';
if(view!=='y'){h+='<tfoot><tr><td>'+(i<3?'연 합계':'연간')+'</td>'+cols.map(c=>{const v=val(tot[c.y],i);return `<td class="${v==null?'na':v<0?'neg':''}">${fmt(i,v,true)}</td>`;}).join('')+'</tr></tfoot>';}
return h+'</table>';}

function render(){
charts.forEach(c=>c.destroy());charts=[];legend();
const B=build(),C=yc(),grid=css('--grid'),tick=css('--mute');
const g=document.getElementById('grid');g.innerHTML='';
MET.forEach((M,i)=>{
const card=document.createElement('section');card.className='card';
const isOpen=open.has(i);
card.innerHTML=`<h2>${M.t}</h2><p class="hint">${M.h}</p><div class="chart"><canvas role="img" aria-label="${M.t} ${view==='m'?'월별':view==='q'?'분기별':'연도별'} 그래프"></canvas></div>
<button class="tog" aria-expanded="${isOpen}" aria-controls="t${i}"><span class="ar" aria-hidden="true">▸</span><span class="lb">${isOpen?'표 접기':'표로 데이터 보기'}</span></button>
<div class="tbl" id="t${i}" ${isOpen?'':'hidden'}>${table(i,B)}</div>`;
g.appendChild(card);
const btn=card.querySelector('.tog'),tb=card.querySelector('.tbl');
btn.onclick=()=>{const o=btn.getAttribute('aria-expanded')!=='true';btn.setAttribute('aria-expanded',o);tb.hidden=!o;btn.querySelector('.lb').textContent=o?'표 접기':'표로 데이터 보기';o?open.add(i):open.delete(i);};
let labels,sets;
if(view==='y'){labels=B.rows.map(r=>r.lab.replace('년',''));sets=[{data:B.rows.map(r=>val(B.cell(r),i)),backgroundColor:B.rows.map(r=>C[ci(r.key)]),borderRadius:4,maxBarThickness:56}];}
else{labels=B.rows.map(r=>r.lab);sets=B.cols.map(c=>{const yi=ci(c.y);const d=B.rows.map(r=>val(B.cell(r,c),i));return view==='m'?{label:c.y+'년',data:d,borderColor:C[yi],backgroundColor:C[yi],borderDash:DASH[yi],borderWidth:2,pointRadius:2.5,pointHoverRadius:5,tension:.25}:{label:c.y+'년',data:d,backgroundColor:C[yi],borderRadius:3,maxBarThickness:20};});}
charts.push(new Chart(card.querySelector('canvas'),{type:view==='m'?'line':'bar',data:{labels,datasets:sets},
options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>(c.dataset.label?c.dataset.label+': ':'')+fmt(i,c.parsed.y,i<3)}}},
scales:{x:{grid:{display:false},ticks:{color:tick,font:{size:11},autoSkip:false,maxRotation:0}},y:{grid:{color:grid},border:{display:false},ticks:{color:tick,font:{size:11},callback:v=>fmt(i,v)}}}}}));
});}

const chBox=document.getElementById('chs');
CHS.forEach(c=>{const b=document.createElement('button');b.className='chip';b.textContent=c;b.setAttribute('aria-pressed',c===ch);b.onclick=()=>{ch=c;chBox.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',x===b));render();};chBox.appendChild(b);});
document.querySelectorAll('#views button').forEach(b=>b.onclick=()=>{view=b.dataset.v;document.querySelectorAll('#views button').forEach(x=>x.setAttribute('aria-pressed',x===b));render();});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',render);
new MutationObserver(render).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
try{Chart.defaults.font.family=getComputedStyle(document.body).fontFamily;}catch(e){}
render();
</script>
</body>
</html>
